<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snakes &amp; Ladders</title>
<style>
:root{--bg:#1d2b2a;--panel:#26383a;--ink:#f4efe2;--muted:#9fb5ae;--c1:#e9dcb8;--c2:#cdbf95}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#2c4543,var(--bg));color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center}
h1{font-family:Georgia,serif;font-size:clamp(1.6rem,4vw,2.4rem);margin:14px 0 4px;letter-spacing:.5px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:#f2b84b;color:#2a1d00;font-weight:700}
button:hover{filter:brightness(1.08)}button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible{outline:3px solid #fff}
#setup{text-align:center;padding:20px}
#setup p{color:var(--muted)}
.counts{display:flex;gap:10px;justify-content:center;margin:18px 0;flex-wrap:wrap}
.counts button{width:64px;height:64px;font-size:1.6rem;border-radius:50%}
.counts button.sel{background:#6fd3b0;outline:3px solid #fff}
#game{display:none;width:100%;max-width:1000px;padding:8px;gap:16px;flex-wrap:wrap;justify-content:center}
#boardWrap{width:min(92vw,600px);position:relative}
#board{position:relative;width:100%;aspect-ratio:1;border:6px solid #5a3e22;border-radius:8px;background:#fff;overflow:hidden}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.cell{font-size:clamp(7px,1.6vw,12px);padding:2px 3px;color:#5b4a2a;font-weight:700}
.cell:nth-child(odd){background:var(--c1)}
.cell.alt{background:var(--c2)}
svg.ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok{position:absolute;width:4.6%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 2px 5px #0008;transition:left .22s ease,top .22s ease;display:grid;place-items:center;font-size:clamp(6px,1.5vw,11px);font-weight:700;color:#fff;z-index:3}
.tok.hop{animation:hop .22s}
@keyframes hop{50%{transform:translate(-50%,-90%) scale(1.15)}}
#side{width:min(92vw,300px);display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border-radius:14px;padding:14px}
#die{font-size:5rem;line-height:1;text-align:center;user-select:none}
#die.roll{animation:shake .12s infinite}
@keyframes shake{25%{transform:rotate(-14deg) translateY(-4px)}75%{transform:rotate(14deg) translateY(4px)}}
#msg{min-height:2.6em;color:var(--muted);text-align:center;margin:6px 0 10px}
#roll{width:100%;font-size:1.1rem}
.pl{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;border:2px solid transparent}
.pl.on{border-color:#f2b84b;background:#ffffff14}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.pl b{margin-left:auto}
.tools{display:flex;gap:8px}.tools button{flex:1;background:#46605f;color:var(--ink)}
#win{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:10;text-align:center}
#win.show{display:grid;animation:fade .5s}
@keyframes fade{from{opacity:0}}
#win .card{position:relative;z-index:2;animation:pop 1s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}}
#win .trophy{font-size:7rem;animation:bounce 1s infinite alternate ease-in-out}
@keyframes bounce{to{transform:translateY(-18px) rotate(6deg)}}
#win h2{font-family:Georgia,serif;font-size:clamp(2rem,7vw,3.6rem);margin:0 0 14px;color:#ffd75e;text-shadow:0 0 20px #f2b84b}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
@media (prefers-reduced-motion:reduce){.tok{transition:none}#win .trophy{animation:none}}
</style>
</head>
<body>
<h1>Snakes &amp; Ladders</h1>

<div id="setup">
  <p>How many players?</p>
  <div class="counts" id="counts"></div>
  <button id="start">Start game</button>
</div>

<div id="game">
  <div id="boardWrap"><div id="board"><div class="grid" id="grid"></div><svg class="ov" id="svg" viewBox="0 0 100 100"></svg></div></div>
  <div id="side">
    <div class="box"><div id="die">🎲</div><div id="msg"></div><button id="roll">Roll die</button></div>
    <div class="box" id="plist"></div>
    <div class="tools"><button id="mute">🔊 Sound on</button><button id="again">New game</button></div>
  </div>
</div>

<div id="win"><canvas id="fx"></canvas><div class="card"><div class="trophy">🏆</div><h2 id="wname"></h2><button id="playAgain">Play again</button></div></div>

<script>
const SNAKES={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78};
const LADDERS={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
const COLORS=['#e63946','#2a7de1','#2fa84f','#f4a300','#9b5de5','#00b4a6'];
const NAMES=['Red','Blue','Green','Gold','Purple','Teal'];
const DICE=['⚀','⚁','⚂','⚃','⚄','⚅'];
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- Sound (Web Audio, no files needed) ---------- */
let ac,muted=false;
const A=()=>{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac};
function tone(f,t=0,d=.15,type='sine',v=.2,f2){
  if(muted)return;const c=A(),o=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;
  o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);
  g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);
  o.connect(g).connect(c.destination);o.start(s);o.stop(s+d+.03);
}
function click(t=0,v=.4){ // dice clatter: short filtered noise burst
  if(muted)return;const c=A(),n=c.sampleRate*.04|0,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  f.type='bandpass';f.frequency.value=1200+Math.random()*2500;g.gain.value=v;
  s.buffer=b;s.connect(f).connect(g).connect(c.destination);s.start(c.currentTime+t);
}
const sfx={
  roll(){for(let i=0;i<12;i++)click(i*.06+i*i*.004,.5-i*.025)},
  land(){tone(180,0,.12,'triangle',.3,90)},
  step(i){tone(330+i*18,0,.09,'square',.08)},
  ladder(){[0,1,2,3,4,5,6].forEach(i=>tone(392*Math.pow(1.122,i*1.5),i*.07,.14,'triangle',.18))},
  snake(){tone(700,0,.7,'sawtooth',.14,90);tone(710,.02,.7,'sine',.1,80)},
  turn(){tone(660,0,.06,'sine',.08)},
  win(){
    [523,659,784,1047].forEach((f,i)=>tone(f,i*.15,.3,'triangle',.22));
    [523,659,784,1047,1319].forEach(f=>tone(f,.7,1.2,'triangle',.12));
    [1568,1760,2093,1760,2349,2637].forEach((f,i)=>tone(f,.8+i*.12,.2,'sine',.1));
    [262,330,392,523].forEach((f,i)=>tone(f,1.9+i*.14,.35,'triangle',.18));
  }
};

/* ---------- Board ---------- */
function xy(n){ // centre of square n in 0-100 units
  const r=Math.floor((n-1)/10),k=(n-1)%10,c=r%2?9-k:k;
  return [c*10+5,(9-r)*10+5];
}
function buildBoard(){
  const g=$('grid');g.innerHTML='';
  for(let row=9;row>=0;row--)for(let col=0;col<10;col++){
    const n=row*10+(row%2?9-col:col)+1,d=document.createElement('div');
    d.className='cell'+((row+col)%2?' alt':'');d.textContent=n;g.appendChild(d);
  }
  const svg=$('svg');let h='';
  for(const [a,b] of Object.entries(LADDERS)){
    const [x1,y1]=xy(+a),[x2,y2]=xy(b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),px=-dy/L*1.3,py=dx/L*1.3;
    h+=`<g stroke="#7a4b21" stroke-linecap="round"><line x1="${x1+px}" y1="${y1+py}" x2="${x2+px}" y2="${y2+py}" stroke-width="1"/><line x1="${x1-px}" y1="${y1-py}" x2="${x2-px}" y2="${y2-py}" stroke-width="1"/>`;
    const m=Math.max(2,Math.round(L/4.5));
    for(let i=1;i<m;i++){const t=i/m;h+=`<line x1="${x1+dx*t+px}" y1="${y1+dy*t+py}" x2="${x1+dx*t-px}" y2="${y1+dy*t-py}" stroke-width=".8"/>`}
    h+='</g>';
  }
  const sc=['#c0392b','#16a085','#8e44ad','#d35400','#2c7fb8'];let i=0;
  for(const [a,b] of Object.entries(SNAKES)){
    const [x1,y1]=xy(+a),[x2,y2]=xy(b),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*6,ny=dx/L*6,col=sc[i++%sc.length];
    h+=`<path d="M${x1} ${y1}C${x1+dx*.3+nx} ${y1+dy*.3+ny} ${x1+dx*.7-nx} ${y1+dy*.7-ny} ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round" opacity=".92"/>
    <path d="M${x1} ${y1}C${x1+dx*.3+nx} ${y1+dy*.3+ny} ${x1+dx*.7-nx} ${y1+dy*.7-ny} ${x2} ${y2}" fill="none" stroke="#fff" stroke-width=".5" stroke-dasharray="1 2.2" stroke-linecap="round"/>
    <circle cx="${x1}" cy="${y1}" r="2.2" fill="${col}"/><circle cx="${x1-.8}" cy="${y1-.6}" r=".5" fill="#fff"/><circle cx="${x1+.8}" cy="${y1-.6}" r=".5" fill="#fff"/>`;
  }
  svg.innerHTML=h;
}

/* ---------- Game state ---------- */
let N=4,pos=[],cur=0,busy=false,over=false;
$('counts').innerHTML=[2,3,4,5,6].map(n=>`<button data-n="${n}" class="${n===4?'sel':''}">${n}</button>`).join('');
$('counts').onclick=e=>{const b=e.target.closest('button');if(!b)return;N=+b.dataset.n;
  [...$('counts').children].forEach(x=>x.classList.toggle('sel',x===b));tone(500+N*60,0,.1,'sine',.15)};
$('start').onclick=()=>{A();$('setup').style.display='none';$('game').style.display='flex';newGame()};
$('again').onclick=()=>{$('game').style.display='none';$('setup').style.display='block'};
$('playAgain').onclick=()=>{stopFx();$('win').classList.remove('show');newGame()};
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 Sound off':'🔊 Sound on'};
$('roll').onclick=roll;
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&$('game').style.display==='flex'&&!$('win').classList.contains('show')&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();roll()}});

function newGame(){
  buildBoard();pos=Array(N).fill(0);cur=0;busy=false;over=false;
  document.querySelectorAll('.tok').forEach(t=>t.remove());
  for(let i=0;i<N;i++){const t=document.createElement('div');t.className='tok';t.id='t'+i;t.style.background=COLORS[i];t.textContent=i+1;$('board').appendChild(t)}
  $('die').textContent='🎲';render();msg(`${NAMES[0]}'s turn — roll the die`);
}
function place(i){
  const t=$('t'+i),p=pos[i],same=[];pos.forEach((q,j)=>{if(q===p)same.push(j)});
  const k=same.indexOf(i),m=same.length;
  let [x,y]=p===0?[3+i*3.2,97]:xy(p);
  if(p>0&&m>1){x+=((k%3)-1)*2.4;y+=(Math.floor(k/3)-.4)*2.6}
  t.style.left=x+'%';t.style.top=y+'%';
}
function render(){
  for(let i=0;i<N;i++)place(i);
  $('plist').innerHTML=pos.map((p,i)=>`<div class="pl ${i===cur?'on':''}"><span class="dot" style="background:${COLORS[i]}"></span>${NAMES[i]}<b>${p||'Start'}</b></div>`).join('');
}
const msg=s=>$('msg').textContent=s;

async function roll(){
  if(busy||over)return;busy=true;$('roll').disabled=true;A();
  const die=$('die');die.classList.add('roll');sfx.roll();
  for(let i=0;i<10;i++){die.textContent=DICE[Math.random()*6|0];await sleep(70+i*12)}
  const v=1+Math.random()*6|0;die.classList.remove('roll');die.textContent=DICE[v-1];sfx.land();
  await sleep(300);
  const p=cur;
  if(pos[p]+v>100){msg(`${NAMES[p]} needs exactly ${100-pos[p]} to finish`)}
  else{
    msg(`${NAMES[p]} rolled ${v}`);
    for(let s=0;s<v;s++){pos[p]++;sfx.step(s);const t=$('t'+p);t.classList.remove('hop');void t.offsetWidth;t.classList.add('hop');render();await sleep(240)}
    if(LADDERS[pos[p]]){msg(`🪜 ${NAMES[p]} climbs a ladder!`);await sleep(250);sfx.ladder();pos[p]=LADDERS[pos[p]];$('t'+p).style.transitionDuration='.8s';render();await sleep(900)}
    else if(SNAKES[pos[p]]){msg(`🐍 Oh no! ${NAMES[p]} slides down a snake`);await sleep(250);sfx.snake();pos[p]=SNAKES[pos[p]];$('t'+p).style.transitionDuration='.9s';render();await sleep(1000)}
    $('t'+p).style.transitionDuration='';
    if(pos[p]===100){return win(p)}
  }
  if(v===6&&pos[p]+0<=100){msg(`${NAMES[p]} rolled a 6 — roll again!`)}else{cur=(cur+1)%N;msg(`${NAMES[cur]}'s turn — roll the die`)}
  sfx.turn();render();busy=false;$('roll').disabled=false;
}

/* ---------- Win celebration ---------- */
let fxOn=false;
function win(p){
  over=true;render();$('wname').textContent=`${NAMES[p]} wins! 🎉`;$('wname').style.color='';
  $('win').classList.add('show');sfx.win();confetti();
}
function stopFx(){fxOn=false}
function confetti(){
  const cv=$('fx'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;fxOn=true;
  const ps=[];
  const burst=(x,y,n)=>{for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*9;
    ps.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:Math.random()*.4-.2,col:COLORS[Math.random()*6|0],life:150+Math.random()*80})}};
  burst(innerWidth/2,innerHeight/2,160);
  let f=0;
  (function loop(){
    if(!fxOn){c.clearRect(0,0,cv.width,cv.height);return}
    f++;if(f%35===0)burst(Math.random()*innerWidth,Math.random()*innerHeight*.5,70);
    if(f%3===0)ps.push({x:Math.random()*innerWidth,y:-10,vx:Math.random()*2-1,vy:2+Math.random()*3,w:7,h:5,r:0,vr:.15,col:COLORS[Math.random()*6|0],life:300});
    c.clearRect(0,0,cv.width,cv.height);
    for(let i=ps.length-1;i>=0;i--){const q=ps[i];q.x+=q.vx;q.y+=q.vy;q.vy+=.18;q.vx*=.99;q.r+=q.vr;q.life--;
      if(q.life<=0||q.y>innerHeight+20){ps.splice(i,1);continue}
      c.save();c.translate(q.x,q.y);c.rotate(q.r);c.globalAlpha=Math.min(1,q.life/40);c.fillStyle=q.col;c.fillRect(-q.w/2,-q.h/2,q.w,q.h);c.restore()}
    requestAnimationFrame(loop);
  })();
}
</script>
</body>
</html>
